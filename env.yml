name: CAI_A2
channels:
  - defaults
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  - pip:
      - torch==2.9.0
      - transformers==4.57.1
      - datasets==4.4.1           # eval/build_mmlu_slice.py pulls the MMLU slice from the Hub.
      - peft==0.18.0              # LoRA config/injection for SFT (Part A) and DPO (Part B).
      - accelerate                # Backs device_map="auto" in training + evaluate.py.
      - requests==2.32.3          # eval/judge.py -> the ask/answer judge endpoint.
      - jsonschema==4.23.0        # Validate results.json against eval/results_schema.json.
      - tqdm==4.67.1              # Convenience: progress bars for your own training loops.
